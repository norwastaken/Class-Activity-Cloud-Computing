<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ron Alcantara | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="Headings">
      <div class="datetime-container"><span id="datetime-display"></span></div>
    </header>

    <main class="login-wrap">
      <section class="block contact-section login-card">
        <h2>Login</h2>
        <form id="login-form" class="contact-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" autocomplete="off" placeholder="Enter your name">
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter your password">
          </div>
          <p id="login-error" class="error-text" role="alert"></p>
          <button type="submit" class="btn-submit">Login</button>
          <p class="hint">Demo: use any username. Password is <strong>1234</strong>.</p>
        </form>
      </section>
    </main>

    <footer class="footer"><p>Ron Alcantara<br>Web Development Class</p></footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
